name: Validate weather app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for file in js/app.js js/api.js js/ui.js js/utils.js api/weather.js sw.js; do
            node --input-type=module --check < "$file"
          done

      - name: Validate PWA manifest
        run: |
          python -c 'import json, pathlib; manifest=json.load(open("manifest.webmanifest")); assert manifest["name"] and manifest["icons"]; assert all(pathlib.Path(icon["src"].removeprefix("./")).is_file() for icon in manifest["icons"]); print("Manifest and icons are valid")'
